name: MeshCom CI

# ---------------------------------------------------------------------------
# DK5EN-Fork: seit 2026-10-11 wieder AN -- dieser Workflow baut und veroeffentlicht
# die Fork-Releases (v4.40a.10.11 war das erste CI-Release).
#
# - Tag `v*`        -> Release, wird "Latest" (der Auto-Update-Dev-Kanal liest es).
# - Tag `ci-proof-*` -> Probelauf als ENTWURF (draft, nie Latest, fuer niemanden sichtbar);
#                       danach Entwurf und Tag loeschen.
# - Jeder andere Tag -> nichts.
#
# Gegenueber upstream zusaetzlich: MC_BUILD_TAG aus dem Tag (Auto-Update-
# Wiedererkennung, AU-D16), T-ETH-ELITE_1262 in Umbenennung und Assets, je ESP32-
# App-Image ein `<name>.autoupdate` (tools/make_autoupdate.py, mit --check
# byte-genau zurueckgeprueft), `wait` nach den im Hintergrund laufenden `mv`.
#
# Abschalten: `if: false` unter `jobs.build` setzen UND den Workflow in den
# Repository-Einstellungen deaktivieren.
# ---------------------------------------------------------------------------

# Fork sku2atsc/MeshCom-Firmware (DM3KS): baut bei jedem Push auf den Branch
# `sperrliste` alle Boards mit der lokalen Sperrliste (src/blocked_calls.h) und
# veroeffentlicht sie als Release "Latest" in diesem Fork. Der Update-Kanal
# "dev" der Firmware zeigt auf dieses Repo (src/fw_update.h, fwChannelRepo).
#
# Release-Tag: strenges Format vX.YYz.MM.DD (fwParseTag()). Standard ist das
# letzte Upstream-Tag unter dem Branch (z.B. v4.40a.10.21); es wird in diesem
# Fork auf den gepatchten Commit verschoben. Fuer einen neuen Build auf
# derselben Basis per Hand (Run workflow) ein neueres Tag eingeben, sonst
# bieten die Knoten das Update nicht an.

on:
  push:
    branches:
    - sperrliste
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (leer = letztes Upstream-Tag, Format v4.40a.MM.DD)'
        required: false
        default: ''

# Boards fuer den Build. Leer ("") = alle Boards aus default_envs wie bei DK5EN.
# Zurzeit nur eine Auswahl, damit der Lauf schnell bleibt; die Safeboot-Envs
# liefern safeboot/bootloader/partitions fuer das Komplett-Flashen.
env:
  BUILD_ENVS: "heltec_wifi_lora_32_V3 ttgo_tbeam LilyGo_T-Beam-1W esp32-safeboot esp32-S3-safeboot"

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Release-Tag bestimmen
      id: tag
      run: |
        TAG="${{ github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*[a-z].[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
        fi
        if [ -z "$TAG" ]; then
          # Fork ohne Tags: Basisversion aus dem letzten Upstream-Release-Commit
          TAG=$(git log --format=%s HEAD | grep -m1 -oE '^release: v[0-9]+\.[0-9]+[a-z]\.[0-9]+\.[0-9]+' | cut -d' ' -f2 || true)
        fi
        echo "$TAG" | grep -Eq '^v[0-9]{1,3}\.[0-9]{1,3}[a-z](\.[0-9]{1,2}\.[0-9]{1,2})?$' \
          || { echo "::error::Tag '$TAG' hat nicht das Format v4.40a.MM.DD"; exit 1; }
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Release-Tag: $TAG"

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        
    - name: Install PlatformIO Core
      run: pip install --upgrade platformio

    - name: Install esptool extension
      run: pip install --upgrade intelhex

    - name: Install RAK Deps
      if: env.BUILD_ENVS == ''
      run: pio platform install nordicnrf52

    # Patch not needed anymore. Is now statically. 
    # See https://github.com/RAKWireless/WisBlock/blob/master/PlatformIO/README.md for details with RAK_PATCH_V2
    #- name: Patch PlatformIO for RAK1
    #  run: "mkdir ~/.platformio/RAK_PATCH && cd ~/.platformio/RAK_PATCH && wget https://raw.githubusercontent.com/RAKWireless/WisBlock/master/PlatformIO/RAK_PATCH.zip && unzip RAK_PATCH.zip && python rak_patch.py"

    #- name: Prepare for RAK Patch2
    #  continue-on-error: true
    #  run: "cd ${{ github.workspace }} && pio run -e wiscore_rak4631 && exit 0"

    #- name: Patch PlatformIO for RAK2
    #  run: "cd ~/.platformio/RAK_PATCH && python rak_patch.py"

    - name: Install ESP32 platform
      run: "pio platform install espressif32"

    - name: Add T-Beam Supreme board definition
      run: "mkdir -p ~/.platformio/platforms/espressif32/boards && wget -O ~/.platformio/platforms/espressif32/boards/t-beams3-supreme.json https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-LoRa-Series/master/boards/t-beams3-supreme.json && cat ~/.platformio/platforms/espressif32/boards/t-beams3-supreme.json"

    - name: Build all Projects
      env:
        # release tags carry their name into the image (AU-D16); proof tags build undated
        MC_BUILD_TAG: ${{ steps.tag.outputs.tag }}
      # Fehler als Annotations ausgeben (im Fork lesbar, auch ohne Log-Zugriff)
      run: |
        set -o pipefail
        cd ${{ github.workspace }}
        ARGS=""
        for e in $BUILD_ENVS; do ARGS="$ARGS -e $e"; done
        echo "pio run$ARGS"
        if ! pio run $ARGS 2>&1 | tee build.log; then
          echo "::warning::FAILED envs: $(grep -E '[[:space:]]FAILED[[:space:]]' build.log | awk '{print $1}' | tr '\n' ' ')"
          grep -E 'error:|undefined reference|multiple definition' build.log | grep -v '\*\*\*' | sort -u | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          grep -m1 -B3 -A12 -E 'error:' build.log | tr '\n' '|' | cut -c1-3000 | sed 's/^/::error::CTX /'
          exit 1
        fi

    - name: Convert RAK to UF2
      if: env.BUILD_ENVS == ''
      run: "wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/wiscore_rak4631/firmware.hex -c -o .pio/build/wiscore_rak4631/wiscore_rak4631.uf2 -f 0xADA52840"

    - name: Convert HELTEC_T114 to UF2
      if: env.BUILD_ENVS == ''
      run: "wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/heltec_t114/firmware.hex -c -o .pio/build/heltec_t114/heltec_t114.uf2 -f 0xADA52840"

    - name: Convert T_ECHO to UF2
      if: env.BUILD_ENVS == ''
      run: "wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2conv.py && wget https://raw.githubusercontent.com/microsoft/uf2/refs/heads/master/utils/uf2families.json && python3 uf2conv.py .pio/build/t_echo/firmware.hex -c -o .pio/build/t_echo/t_echo.uf2 -f 0xADA52840"

    - name: Rename Files
      run: "mv .pio/build/E22_1262-DevKitC/firmware.bin .pio/build/E22_1262-DevKitC/E22_1262-DevKitC.bin &
      mv .pio/build/E22-DevKitC/firmware.bin .pio/build/E22-DevKitC/E22-DevKitC.bin & 
      mv .pio/build/t_deck/firmware.bin .pio/build/t_deck/t_deck.bin & 
      mv .pio/build/t_deck_plus/firmware.bin .pio/build/t_deck_plus/t_deck_plus.bin & 
      mv .pio/build/t_deck_pro/firmware.bin .pio/build/t_deck_pro/t_deck_pro.bin & 
      mv .pio/build/E22_XML-DevKitC/firmware.bin .pio/build/E22_XML-DevKitC/E22_XML-DevKitC.bin & 
      mv .pio/build/E22_1262_S3-DevKitC-1-N16R8/firmware.bin .pio/build/E22_1262_S3-DevKitC-1-N16R8/E22_1262_S3-DevKitC-1-N16R8.bin & 
      mv .pio/build/E22_1268_S3-DevKitC-1-N16R8/firmware.bin .pio/build/E22_1268_S3-DevKitC-1-N16R8/E22_1268_S3-DevKitC-1-N16R8.bin & 
      mv .pio/build/heltec_wifi_lora_32_V2/firmware.bin .pio/build/heltec_wifi_lora_32_V2/heltec_wifi_lora_32_V2.bin &
      mv .pio/build/heltec_wifi_lora_32_V3/firmware.bin .pio/build/heltec_wifi_lora_32_V3/heltec_wifi_lora_32_V3.bin &
      mv .pio/build/heltec_wifi_lora_32_V4/firmware.bin .pio/build/heltec_wifi_lora_32_V4/heltec_wifi_lora_32_V4.bin &
      mv .pio/build/heltec_wireless_stick/firmware.bin .pio/build/heltec_wireless_stick/heltec_wireless_stick.bin &
      mv .pio/build/heltec_wireless_tracker/firmware.bin .pio/build/heltec_wireless_tracker/heltec_wireless_tracker.bin &
      mv .pio/build/ttgo-lora32-v21/firmware.bin .pio/build/ttgo-lora32-v21/ttgo-lora32-v21.bin &
      mv .pio/build/ttgo_tbeam/firmware.bin .pio/build/ttgo_tbeam/ttgo_tbeam.bin &
      mv .pio/build/ttgo_tbeam_SX1262/firmware.bin .pio/build/ttgo_tbeam_SX1262/ttgo_tbeam_SX1262.bin &
      mv .pio/build/ttgo_tbeam_SX1268/firmware.bin .pio/build/ttgo_tbeam_SX1268/ttgo_tbeam_SX1268.bin &
      mv .pio/build/ttgo_tbeam_supreme/firmware.bin .pio/build/ttgo_tbeam_supreme/ttgo_tbeam_supreme.bin &
      mv .pio/build/vision-master-e290/firmware.bin .pio/build/vision-master-e290/vision-master-e290.bin &
      mv .pio/build/vision-master-e213/firmware.bin .pio/build/vision-master-e213/vision-master-e213.bin &
      mv .pio/build/esp32-loraprs-e22/firmware.bin .pio/build/esp32-loraprs-e22/esp32-loraprs-e22.bin &
      mv .pio/build/esp32-loraprs-ra01/firmware.bin .pio/build/esp32-loraprs-ra01/esp32-loraprs-ra01.bin &
      mv .pio/build/wireless-paper/firmware.bin .pio/build/wireless-paper/wireless-paper.bin &
      mv .pio/build/LilyGo_T-Beam-1W/firmware.bin .pio/build/LilyGo_T-Beam-1W/T-Beam-1W.bin &
      mv .pio/build/LilyGo_T3_S3_V1_3/firmware.bin .pio/build/LilyGo_T3_S3_V1_3/T3_S3_V13.bin &
      mv .pio/build/LilyGo_T_Connect_Pro/firmware.bin .pio/build/LilyGo_T_Connect_Pro/t_connect_pro.bin &
      mv .pio/build/T-ETH-ELITE_1262/firmware.bin .pio/build/T-ETH-ELITE_1262/T-ETH-ELITE_1262.bin &
      mv .pio/build/wiscore_rak4631/firmware.zip .pio/build/wiscore_rak4631/wiscore_rak4631.zip &
      mv .pio/build/heltec_t114/firmware.zip .pio/build/heltec_t114/heltec_t114.zip &
      mv .pio/build/t_echo/firmware.zip .pio/build/t_echo/t_echo.zip &
      mv .pio/build/esp32-S3-safeboot/bootloader.bin .pio/build/esp32-S3-safeboot/bootloader-s3.bin &
      wait"

    - name: Auto-update assets (.autoupdate)
      # one zlib twin per ESP32 app image (AU-D11); --check re-inflates and compares byte-exact.
      # make_autoupdate.py refuses any input without the 0xE9 app magic, so no support file slips in.
      run: |
        set -e
        apps=$(ls .pio/build/*/*.bin | grep -v -E '/firmware\.bin$|/(bootloader|bootloader-s3|partitions|otadata|safeboot|safeboot-s3)\.bin$|/esp32-(S3-)?safeboot/')
        echo "$apps"
        n=$(echo "$apps" | wc -l)
        echo "ESP32 app images: $n"
        if [ -z "$BUILD_ENVS" ]; then
          [ "$n" -eq 27 ] || { echo "::error::expected 27 ESP32 app images, found $n"; exit 1; }
        fi
        python3 tools/make_autoupdate.py --check $apps
        z=$(ls .pio/build/*/*.autoupdate | wc -l)
        [ "$z" -eq "$n" ] || { echo "::error::expected $n .autoupdate files, found $z"; exit 1; }

    - name: Tag auf den gepatchten Commit setzen
      # Lehnt GitHub das Verschieben ab, bleibt das Tag am Upstream-Commit;
      # die Release-Dateien sind trotzdem die gepatchten.
      continue-on-error: true
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        git tag -f "$TAG" "$GITHUB_SHA"
        git push -f origin "refs/tags/$TAG"

    - name: Release-Text
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        REPO: ${{ github.repository }}
      run: |
        U="https://github.com/$REPO/releases/download/$TAG"
        {
          echo "## MeshCom-Firmware $TAG mit Sperrliste (DM3KS)"
          echo
          echo "> [!WARNING]"
          echo "> **Dieser Build existiert nur aus einem Grund:** Im Umkreis von **DB0SD** sendet derzeit eine Station ohne Amateurfunklizenz (Pirat) ins MeshCom-Netz. Diese Firmware verwirft deren Aussendungen, damit sie nicht weiter durchs Mesh transportiert werden."
          echo ">"
          echo "> **Wer nicht direkt davon betroffen ist, verwendet bitte die offizielle Firmware:** [icssw-org/MeshCom-Firmware](https://github.com/icssw-org/MeshCom-Firmware/releases) bzw. den Build von [DK5EN](https://github.com/DK5EN/MeshCom-Firmware/releases). Dies ist **kein** offizielles Release."
          echo
          echo "### What this release is"
          echo
          echo "DK5EN \`$TAG\` plus Sperrliste. Inhalt und Neuerungen des Basis-Release: siehe [DK5EN $TAG](https://github.com/DK5EN/MeshCom-Firmware/releases/tag/$TAG)."
          echo
          echo "### Unterschiede zum DK5EN-Build $TAG"
          echo
          echo "1. **Sperrliste (neu).** Frames, deren Absender **oder** ein Relais im Pfad auf der Liste steht, werden beim Empfang verworfen: keine Anzeige, keine Weitergabe an App/BLE, kein Upload zum Server, **kein Weiterleiten im Mesh**. Auf einem Gateway werden solche Frames ausserdem nicht vom Server auf LoRa gesendet. Konsole: \`[RX];drop;blocked;...\`."
          echo "2. **Voreingestellt** ist das betroffene Rufzeichen (alle SSIDs). Ein Eintrag ohne SSID sperrt alle SSIDs, mit SSID (z.B. \`XX1ABC-12\`) nur diese. Bis zu 16 Eintraege."
          echo "3. **Web-GUI:** neue Karte Setup -> **Blocked callsigns** zum Ansehen und Bearbeiten der Liste."
          echo "4. **Konsole:** neuer Befehl \`--blockcall CALL1,CALL2\`, \`--blockcall none\` (leeren), \`--blockcall\` (anzeigen). Die Liste wird dauerhaft gespeichert (ESP32: NVS, nRF52: Datei) und ueberlebt Neustart und Update."
          echo "5. **Auto-Update-Kanal dev** (\`--updchan dev\`, Web-GUI \"notify (dev, DM3KS releases)\") zeigt auf **diesen Fork** statt auf DK5EN. Der Kanal **prod** zeigt weiterhin auf die offizielle Firmware von icssw-org (dann ohne Sperrliste)."
          echo "6. **Nur ausgewaehlte Boards** gebaut (siehe Tabelle), nicht alle 27 wie bei DK5EN."
          echo
          echo "Alles andere (Funktionen, Einstellungen, Protokoll) entspricht DK5EN \`$TAG\`. Die Einstellungen bleiben beim Wechsel erhalten."
          echo
          echo "### Firmware zum Download"
          echo
          echo "| Board | Firmware (.bin) | Auto-Update |"
          echo "|---|---|---|"
          for f in .pio/build/*/*.bin; do
            n=$(basename "$f")
            case "$n" in firmware.bin|bootloader*.bin|partitions.bin|otadata.bin|safeboot*.bin) continue;; esac
            b="${n%.bin}"
            a=""; [ -f "$(dirname "$f")/$b.autoupdate" ] && a="[$b.autoupdate]($U/$b.autoupdate)"
            echo "| $b | [$n]($U/$n) | $a |"
          done
          echo
          echo "Komplett-Flashen (Safeboot, Bootloader, Partitionen, otadata) wie bei DK5EN: die uebrigen Dateien unter **Assets**."
          echo
          echo "Gebaut von GitHub Actions aus Commit \`${GITHUB_SHA:0:8}\`."
        } > release-notes-fork.md
        cat release-notes-fork.md

    - uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.tag.outputs.tag }}
        commit: ${{ github.sha }}
        name: ${{ steps.tag.outputs.tag }} (Sperrliste DM3KS)
        allowUpdates: true
        draft: false
        makeLatest: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: ".pio/build/E22_1262-DevKitC/E22_1262-DevKitC.bin,
        .pio/build/E22-DevKitC/E22-DevKitC.bin,
        .pio/build/t_deck/t_deck.bin,
        .pio/build/t_deck_plus/t_deck_plus.bin,
        .pio/build/t_deck_pro/t_deck_pro.bin,
        .pio/build/E22_XML-DevKitC/E22_XML-DevKitC.bin,
        .pio/build/E22_1262_S3-DevKitC-1-N16R8/E22_1262_S3-DevKitC-1-N16R8.bin,
        .pio/build/E22_1268_S3-DevKitC-1-N16R8/E22_1268_S3-DevKitC-1-N16R8.bin,
        .pio/build/heltec_wifi_lora_32_V2/heltec_wifi_lora_32_V2.bin,
        .pio/build/heltec_wifi_lora_32_V3/heltec_wifi_lora_32_V3.bin,
        .pio/build/heltec_wifi_lora_32_V4/heltec_wifi_lora_32_V4.bin,
        .pio/build/heltec_wireless_stick/heltec_wireless_stick.bin,
        .pio/build/heltec_wireless_tracker/heltec_wireless_tracker.bin,
        .pio/build/ttgo-lora32-v21/ttgo-lora32-v21.bin,
        .pio/build/ttgo_tbeam/ttgo_tbeam.bin,
        .pio/build/ttgo_tbeam_SX1262/ttgo_tbeam_SX1262.bin,
        .pio/build/ttgo_tbeam_SX1268/ttgo_tbeam_SX1268.bin,
        .pio/build/ttgo_tbeam_supreme/ttgo_tbeam_supreme.bin,
        .pio/build/vision-master-e290/vision-master-e290.bin,
        .pio/build/vision-master-e213/vision-master-e213.bin,
        .pio/build/esp32-loraprs-e22/esp32-loraprs-e22.bin,
        .pio/build/esp32-loraprs-ra01/esp32-loraprs-ra01.bin,
        .pio/build/wireless-paper/wireless-paper.bin,
        .pio/build/LilyGo_T-Beam-1W/T-Beam-1W.bin,
        .pio/build/LilyGo_T3_S3_V1_3/T3_S3_V13.bin,
        .pio/build/LilyGo_T_Connect_Pro/t_connect_pro.bin,
        .pio/build/T-ETH-ELITE_1262/T-ETH-ELITE_1262.bin,
        .pio/build/*/*.autoupdate,
        .pio/build/wiscore_rak4631/wiscore_rak4631.zip,
        .pio/build/wiscore_rak4631/wiscore_rak4631.uf2,
        .pio/build/heltec_t114/heltec_t114.zip,
        .pio/build/heltec_t114/heltec_t114.uf2,
        .pio/build/t_echo/t_echo.zip,
        .pio/build/t_echo/t_echo.uf2,
        .pio/build/esp32-S3-safeboot/safeboot-s3.bin,
        .pio/build/esp32-safeboot/safeboot.bin,
        .pio/build/esp32-S3-safeboot/bootloader-s3.bin,
        .pio/build/esp32-safeboot/bootloader.bin,
        .pio/build/esp32-safeboot/partitions.bin,
        otadata.bin"

        # release-notes.md traegt AUSSCHLIESSLICH den Text des aktuellen
        # Release. release.md ist das fortlaufende deutsche Journal ueber
        # alle Releases und waere als Release-Body unbrauchbar lang.
        bodyFile: "release-notes-fork.md"